<title>Entrar com biometria | DISMEPE ONE Indústrias</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ecf3ef;color:#17392b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;display:grid;place-items:center;padding:22px}
main{width:min(100%,410px);background:white;padding:28px 24px;border-radius:20px;border:1px solid #d4e4d8;box-shadow:0 12px 38px #123d2914}
.logo{display:block;width:185px;height:auto;max-height:70px;object-fit:contain;margin:0 auto 14px}h1{font-size:22px;line-height:1.2;margin:6px 0 9px;text-align:center}
p{color:#526e5d;font-size:13px;line-height:1.5;text-align:center}
label{display:block;margin:24px 0 8px;font-size:13px;font-weight:750}
input{width:100%;padding:13px;border:1px solid #bed3c3;border-radius:11px;font:inherit;font-size:15px;outline-color:#087b51}
button{width:100%;padding:13px;border:0;border-radius:11px;background:#087b51;color:white;font:inherit;font-weight:800;cursor:pointer;margin-top:15px}
button:disabled{opacity:.55;cursor:not-allowed}a{display:block;text-align:center;color:#087b51;font-size:13px;font-weight:650;margin-top:21px}#passkeyLoginStatus{min-height:24px}
</style></head><body>
<main>

<form id="passkeyLoginForm">
<label for="passkeyLoginUser">Usuário</label>
<input id="passkeyLoginUser" name="usuario" required maxlength="160" autocomplete="username webauthn" placeholder="Digite seu usuário">
<button type="submit" id="passkeyLoginButton">Entrar com chave de acesso</button>
</form>
<p id="passkeyLoginStatus" role="status" aria-live="polite"></p>
<a href="/">Voltar ao login com senha</a>
</main>
