<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inteligência Comercial | DISMEPE ONE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--g:#005548;--g2:#087864;--bg:#f4f7f6;--card:#fff;--bd:#d8e5e1;--tx:#17332c;--mut:#667b75;--red:#be123c;--amber:#b45309;--blue:#0369a1;--green:#047857;font-family:'Segoe UI',Tahoma,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx)}body{padding-bottom:32px}header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#dff0e8,#e4efeb);border-bottom:1px solid #cde5da;box-shadow:0 4px 16px rgba(0,63,54,.08)}.top{max-width:1500px;margin:auto;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:950;color:var(--g);font-size:18px}.brand small{display:block;font-size:8px;letter-spacing:.15em;color:#60746f}.back{border:1px solid #cbd7d3;background:#fff;color:var(--g);border-radius:10px;padding:9px 12px;font-weight:900;cursor:pointer}main{max-width:1500px;margin:auto;padding:18px;display:grid;gap:14px}.hero{background:linear-gradient(135deg,#e8f6f1,#fff);border:1px solid var(--bd);border-radius:18px;padding:18px;display:flex;justify-content:space-between;gap:14px;align-items:end;flex-wrap:wrap}.hero h1{margin:2px 0;font-size:24px}.hero p{margin:0;color:var(--mut);font-size:11px;max-width:760px}.eyebrow{font-size:9px;font-weight:900;color:#079b72;letter-spacing:.16em}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{height:39px;border:1px solid var(--bd);border-radius:10px;padding:0 10px;background:#fff;color:var(--tx);font-weight:700}.filters input{min-width:260px}.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:13px}.kpi .l{font-size:8px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:900}.kpi .v{font-size:22px;font-weight:950;margin-top:3px}.kpi .s{font-size:9px;color:var(--mut);margin-top:3px}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:2px}.tab{border:1px solid var(--bd);background:#fff;color:#35554d;border-radius:10px;padding:9px 12px;font-size:10px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:var(--g);color:#fff;border-color:var(--g)}.panel{background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.panel-head h2{font-size:15px;margin:0}.panel-head p{font-size:9px;color:var(--mut);margin:3px 0 0}.badge{border-radius:999px;padding:4px 8px;font-size:8px;font-weight:900;background:#eef5f2;color:var(--g)}.table-wrap{max-height:68vh;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1200px}.table th{position:sticky;top:0;background:#eef5f2;z-index:2;font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:#52645f;text-align:left;padding:9px;border-bottom:1px solid var(--bd);cursor:pointer}.table td{font-size:10px;padding:9px;border-bottom:1px solid #edf2f0;vertical-align:top}.table tr:hover td{background:#fafcfb}.num{text-align:right}.pill{display:inline-block;border-radius:999px;padding:3px 7px;font-size:8px;font-weight:900}.danger{background:#fff1f2;color:var(--red)}.warn{background:#fffbeb;color:var(--amber)}.ok{background:#ecfdf5;color:var(--green)}.info{background:#eff6ff;color:var(--blue)}.spark{display:flex;gap:3px;align-items:flex-end;height:24px}.spark span{width:7px;background:#9fcfc2;border-radius:3px 3px 0 0;min-height:2px}.action{font-weight:900;color:var(--g);font-size:9px}.supplier-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:14px}.supplier{border:1px solid var(--bd);border-radius:12px;padding:11px;background:#fbfdfc}.supplier b{font-size:10px}.supplier div{font-size:9px;color:var(--mut);margin-top:5px}.empty{padding:40px;text-align:center;color:var(--mut)}.formula{font-size:9px;color:var(--mut);padding:10px 14px;background:#fbfdfc;border-top:1px solid var(--bd)}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.supplier-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main{padding:10px}.top{padding:9px 10px}.hero{padding:13px}.hero h1{font-size:18px}.filters{width:100%}.filters input,.filters select{width:100%;min-width:0}.kpis{grid-template-columns:repeat(2,1fr)}.kpi .v{font-size:18px}.supplier-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">DISMEPE ONE<small>INTELIGÊNCIA COMERCIAL</small></div><button class="back" onclick="location.href='/'"><i class="fa-solid fa-arrow-left"></i> Voltar</button></div></header>
<main>
<section class="hero"><div><div class="eyebrow">MAPA DE ESTOQUE · VISÃO ADMINISTRATIVA</div><h1>Inteligência Comercial</h1><p id="subtitle">Carregando leitura completa do mapa...</p></div><div class="filters"><input id="search" placeholder="Buscar produto, código ou fornecedor"><select id="supplier"><option value="">Todos os fornecedores</option></select><select id="curve"><option value="">Todas as curvas</option></select></div></section>
<section class="kpis" id="kpis"></section>
<nav class="tabs" id="tabs"></nav>
<section class="panel"><div class="panel-head"><div><h2 id="title">Visão geral</h2><p id="desc"></p></div><span class="badge" id="count">0 produtos</span></div><div id="content"></div><div class="formula" id="formula"></div></section>
</main>
<script>
const S={all:[],filtered:[],tab:'overview',sort:'produto',dir:1,data:null};
const fmt=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['overview','Visão geral'],['critical','Críticos'],['low','Venda abaixo da média'],['high','Venda acima do normal'],['dde','DDE'],['noTurn','Sem giro'],['suppliers','Fornecedores']];
function kpis(){const r=S.data.resumo;const x=[['Produtos',r.produtos,'Base completa'],['Críticos',r.criticos,'Prioridade imediata'],['Em queda',r.queda,'Último mês fechado'],['Em alta',r.alta,'Acima do padrão'],['Sem giro',r.semGiro,'Estoque sem média'],['Valor estoque',money(r.valorEstoque),fmt(r.unidadesEstoque)+' un.']];document.getElementById('kpis').innerHTML=x.map(a=>`<div class="kpi"><div class="l">${a[0]}</div><div class="v">${a[1]}</div><div class="s">${a[2]}</div></div>`).join('')}
function buildFilters(){const su=[...new Set(S.all.map(x=>x.fornecedor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));supplier.innerHTML='<option value="">Todos os fornecedores</option>'+su.map(x=>`<option>${esc(x)}</option>`).join('');const cu=[...new Set(S.all.map(x=>x.curva).filter(Boolean))].sort();curve.innerHTML='<option value="">Todas as curvas</option>'+cu.map(x=>`<option>${esc(x)}</option>`).join('')}
function filter(){const q=search.value.trim().toLowerCase(),su=supplier.value,cu=curve.value;S.filtered=S.all.filter(x=>(!q||[x.produto,x.codigo,x.ean,x.fornecedor].join(' ').toLowerCase().includes(q))&&(!su||x.fornecedor===su)&&(!cu||x.curva===cu));render()}
function tabRows(){let r=S.filtered.slice();if(S.tab==='critical')r=r.filter(x=>x.critico);if(S.tab==='low')r=r.filter(x=>x.baixo);if(S.tab==='high')r=r.filter(x=>x.alta);if(S.tab==='dde')r=r.filter(x=>x.estoque>0).sort((a,b)=>b.dde-a.dde);if(S.tab==='noTurn')r=r.filter(x=>x.semGiro);return r}
function spark(h){const m=Math.max(1,...h.map(Number));return `<div class="spark">${h.map(v=>`<span style="height:${Math.max(2,Math.round(Number(v)/m*24))}px" title="${fmt(v)}"></span>`).join('')}</div>`}
function badge(x){if(x.critico)return '<span class="pill danger">CRÍTICO</span>';if(x.alta)return '<span class="pill info">EM ALTA</span>';if(x.baixo)return '<span class="pill warn">EM QUEDA</span>';return '<span class="pill ok">NORMAL</span>'}
function table(rows){const labels=S.data.meses;const cols=[['produto','Produto'],['fornecedor','Fornecedor'],['estoque','Estoque'],['mediaUnidades','Média'],['dde','DDE'],['variacaoPct','Variação'],['acao','Ação']];return `<div class="table-wrap"><table class="table"><thead><tr><th>Código</th>${cols.map(c=>`<th data-sort="${c[0]}">${c[1]}</th>`).join('')}<th>${labels[0]}</th><th>${labels[1]}</th><th>${labels[2]}</th><th>${labels[3]}</th><th>Histórico</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.codigo)}</td><td><b>${esc(x.produto)}</b><br>${badge(x)}</td><td>${esc(x.fornecedor)}</td><td class="num">${fmt(x.estoque)}</td><td class="num">${fmt(x.mediaUnidades)}</td><td class="num"><b>${fmt(x.dde)}</b></td><td class="num">${x.variacaoPct>0?'+':''}${fmt(x.variacaoPct)}%</td><td class="action">${esc(x.acao)}</td>${x.historico.map(v=>`<td class="num">${fmt(v)}</td>`).join('')}<td>${spark(x.historico)}</td></tr>`).join('')}</tbody></table></div>`}
function render(){tabsEl=document.getElementById('tabs');tabsEl.innerHTML=tabs.map(t=>`<button class="tab ${S.tab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');tabsEl.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});const info={overview:['Visão geral','Todos os produtos do Mapa de Estoque.'],critical:['Críticos','Ruptura, pressão elevada, queda forte ou estoque sem giro.'],low:['Venda abaixo da média','Último mês fechado abaixo de 70% da média dos dois anteriores.'],high:['Venda acima do normal','Último mês fechado acima de 130% da média anterior.'],dde:['DDE','Ordenado pelo indicador solicitado. Quanto maior, maior a pressão da média sobre o estoque.'],noTurn:['Sem giro','Produtos com estoque e média de venda zerada.'],suppliers:['Visão por fornecedor','Concentração de críticos, quedas, altas e estoque.']};title.textContent=info[S.tab][0];desc.textContent=info[S.tab][1];if(S.tab==='suppliers'){const q=search.value.trim().toLowerCase(),su=supplier.value;let rows=S.data.fornecedores.filter(x=>(!q||x.fornecedor.toLowerCase().includes(q))&&(!su||x.fornecedor===su));count.textContent=rows.length+' fornecedores';content.innerHTML='<div class="supplier-grid">'+rows.map(x=>`<div class="supplier"><b>${esc(x.fornecedor)}</b><div>${x.produtos} produtos · ${x.criticos} críticos · ${x.queda} em queda · ${x.alta} em alta</div><div>Estoque: ${money(x.valorEstoque)}</div></div>`).join('')+'</div>';return}let rows=tabRows();count.textContent=rows.length+' produtos';content.innerHTML=rows.length?table(rows):'<div class="empty">Nenhum produto neste recorte.</div>';document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;if(S.sort===k)S.dir*=-1;else{S.sort=k;S.dir=1}rows.sort((a,b)=>typeof a[k]==='number'?(a[k]-b[k])*S.dir:String(a[k]||'').localeCompare(String(b[k]||''),'pt-BR')*S.dir;content.innerHTML=table(rows);renderSortHandlers()})}
function renderSortHandlers(){document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;const rows=tabRows();if(S.sort===k)S.dir*=-1;else{S.sort=k;S.dir=1}rows.sort((a,b)=>typeof a[k]==='number'?(a[k]-b[k])*S.dir:String(a[k]||'').localeCompare(String(b[k]||''),'pt-BR')*S.dir;content.innerHTML=table(rows);renderSortHandlers()})}
async function load(){try{const r=await fetch('/data/inteligencia-comercial?ts='+Date.now(),{credentials:'same-origin',cache:'no-store'});if(r.status===403){location.href='/';return}if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||'Falha ao carregar');S.data=await r.json();S.all=S.data.produtos||[];S.filtered=S.all.slice();subtitle.textContent=S.data.criterioTendencia+' Fonte atualizada em '+(S.data.atualizadoEm||'—')+'.';formula.textContent='DDE: '+S.data.formulaDDE+'. O mês corrente aparece na tabela, mas os alertas de tendência usam meses fechados.';kpis();buildFilters();render()}catch(e){content.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
search.addEventListener('input',filter);supplier.addEventListener('change',filter);curve.addEventListener('change',filter);load();
</script>
</body></html>
