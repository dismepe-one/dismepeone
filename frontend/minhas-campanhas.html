<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e1f0ea">
  <title>Minhas campanhas | DISMEPE ONE</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--green:#087b51;--green-dark:#055d3f;--green-soft:#edf9f3;--green-line:#b9e3cf;--ink:#193329;--muted:#63786c;--line:#deebe2;--bg:#f2f6f3;--card:#fff;--red:#b42318;--red-soft:#fff3f2;--red-line:#efc1bd;--amber:#8a5c14;--shadow:0 8px 30px rgba(25,51,41,.05)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}button,a,input,select{font:inherit}button{cursor:pointer}
    header{background:linear-gradient(135deg,#DFF0E8 0%,#E1F0EA 50%,#E4EFEB 100%);border-bottom:1px solid #c8d2cf;padding:9px max(18px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 5px 18px rgba(0,63,54,.10)}
    header img{width:clamp(140px,24vw,188px);max-height:56px;object-fit:contain}header a{font-weight:850;font-size:12px;color:#005548;text-decoration:none;border:1px solid rgba(0,85,72,.18);background:rgba(255,255,255,.52);border-radius:9px;padding:9px 12px;white-space:nowrap}
    main{max-width:1180px;margin:0 auto;padding:27px 18px 50px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}.eyebrow{color:#15824c;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(25px,4vw,33px);margin:7px 0 0;letter-spacing:-.025em}.page-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}.update-meta{text-align:right}.update-meta strong{display:block;font-size:13px}.update-meta span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.refresh{min-height:40px;border:0;border-radius:10px;background:#12834d;color:#fff;padding:10px 14px;font-size:12px;font-weight:850}.refresh:disabled{opacity:.55;cursor:default}
    .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px}.kpi,.panel,.lab-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.kpi{padding:17px 19px}.kpi span{color:#61796c;font-size:11px;font-weight:800;display:block}.kpi strong{font-size:29px;line-height:1.45;color:#16553b}.kpi small{display:block;color:var(--muted);font-size:10px;margin-top:1px}
    .panel{padding:16px;margin-bottom:16px}.toolbar{display:grid;grid-template-columns:1fr auto 210px;gap:10px;align-items:center}.input,.select{width:100%;height:42px;border:1px solid #dce7e1;border-radius:10px;background:#fff;padding:0 12px;color:var(--ink);font-weight:650;outline:none}.input:focus,.select:focus{border-color:#76bda0;box-shadow:0 0 0 3px rgba(8,123,81,.08)}.status-filters{display:flex;gap:8px;flex-wrap:wrap}.status-filter{height:42px;border:1px solid #dce7e1;border-radius:10px;background:#fff;padding:0 12px;color:#52615a;font-size:11px;font-weight:900}.status-filter.active[data-status="META_ATINGIDA"]{background:var(--green-soft);border-color:var(--green-line);color:var(--green-dark)}.status-filter.active[data-status="ABAIXO_META"]{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
    .warnings{display:none;margin-bottom:16px;padding:13px 14px;border-radius:12px;background:#fff8e9;border:1px solid #efdfaa;color:#725000;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.lab-card{padding:17px;min-width:0;transition:border-color .15s ease,background .15s ease}.lab-card.achieved{background:linear-gradient(180deg,#fff 0%,var(--green-soft) 100%);border-color:var(--green-line)}.lab-card.below{background:linear-gradient(180deg,#fff 0%,var(--red-soft) 100%);border-color:var(--red-line)}.lab-head{display:flex;align-items:flex-start;gap:10px}.lab-name{font-size:16px;font-weight:900;min-width:0;flex:1}.badge{white-space:nowrap;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;background:#eef3f0;color:#52615a}.badge.general{background:#e7f7ef;color:#087b51}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:15px 0}.metric{background:rgba(255,255,255,.72);border:1px solid rgba(222,235,226,.95);border-radius:12px;padding:10px;min-width:0}.lab-card.achieved .metric{border-color:#cce9da}.lab-card.below .metric{border-color:#f1d1ce}.metric span{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.035em}.metric b{display:block;margin-top:3px;font-size:13px;overflow-wrap:anywhere}.metric.projection b.good{color:var(--green-dark)}.metric.projection b.bad{color:var(--red)}.progress-row{display:flex;align-items:center;gap:10px}.progress{height:9px;background:#e8eeeb;border-radius:999px;overflow:hidden;flex:1}.bar{height:100%;border-radius:999px;width:0}.lab-card.achieved .bar{background:var(--green)}.lab-card.below .bar{background:var(--red)}.pct{font-weight:900;min-width:58px;text-align:right}.lab-card.achieved .pct{color:var(--green-dark)}.lab-card.below .pct{color:var(--red)}.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(222,235,226,.9);font-size:11px;color:var(--muted)}.delta.good{color:var(--green);font-weight:900}.delta.bad{color:var(--red);font-weight:900}.delta.neutral{color:var(--amber);font-weight:900}.empty,.loading{grid-column:1/-1;padding:34px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}.error{grid-column:1/-1;padding:22px;background:#fff;border:1px solid #f0c8c5;border-radius:16px;color:var(--red)}
    @media(max-width:1050px){.metrics{grid-template-columns:repeat(3,1fr)}.metric:nth-child(4),.metric:nth-child(5){grid-column:auto}}
    @media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .input{grid-column:1/-1}.grid{grid-template-columns:1fr}.status-filters{justify-content:flex-start}}
    @media(max-width:650px){header{padding:12px 14px}header img{width:132px}header a{font-size:11px;padding:9px 10px}main{padding:21px 12px 38px}.page-head{align-items:flex-start;flex-direction:column;gap:12px}.page-actions{width:100%;justify-content:space-between}.update-meta{text-align:left}.kpis{gap:7px}.kpi{padding:12px 10px}.kpi strong{font-size:23px}.kpi span{font-size:10px}.toolbar{grid-template-columns:1fr}.toolbar .input{grid-column:auto}.status-filters{display:grid;grid-template-columns:1fr 1fr}.status-filter{width:100%;padding:0 8px}.metrics{grid-template-columns:1fr 1fr}.metric:nth-child(5){grid-column:1/-1}.lab-head{display:block}.badge{display:inline-block;margin-top:7px}.foot{display:block}.foot span{display:block;margin-top:4px}}
  </style>
</head>
<body>
<header><img src="/positivacoes/logo.png" alt="Logo oficial DISMEPE ONE"><a href="/">← Voltar à HOME</a></header>
<main>
  <section class="page-head">
    <div><div class="eyebrow">Supervisão de Televendas</div><h1>Minhas campanhas</h1></div>
    <div class="page-actions"><div class="update-meta"><strong id="competence">Competência —</strong><span id="updated">Atualizado: —</span></div><button class="refresh" id="refreshBtn" type="button">Atualizar</button></div>
  </section>
  <section class="kpis" aria-label="Resumo das campanhas">
    <div class="kpi"><span>Campanhas</span><strong id="kCampaigns">—</strong><small>laboratórios acompanhados</small></div>
    <div class="kpi"><span>Metas atingidas</span><strong id="kDone">—</strong><small>campanhas no objetivo ou acima</small></div>
    <div class="kpi"><span>Abaixo da meta</span><strong id="kBelow">—</strong><small>campanhas ainda em andamento</small></div>
  </section>
  <section class="panel"><div class="toolbar"><input class="input" id="search" type="search" placeholder="Pesquisar laboratório"><div class="status-filters" aria-label="Filtrar por resultado"><button class="status-filter active" data-status="META_ATINGIDA" type="button">Meta atingida</button><button class="status-filter active" data-status="ABAIXO_META" type="button">Abaixo da meta</button></div><select class="select" id="sort"><option value="PCT_ASC">Menor atingimento primeiro</option><option value="PCT_DESC">Maior atingimento primeiro</option><option value="SALE_DESC">Maior venda</option><option value="GOAL_DESC">Maior objetivo</option><option value="AZ">Ordem alfabética</option></select></div></section>
  <div class="warnings" id="warnings"></div>
  <section class="grid" id="grid"><div class="loading">Carregando campanhas…</div></section>
</main>
<script>
(function(){'use strict';
 const state={rows:[],data:null,statuses:new Set(['META_ATINGIDA','ABAIXO_META'])};
 const money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
 const number=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2});
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmtMoney=v=>v==null?'—':money.format(Number(v));
 const fmtPct=v=>v==null?'—':number.format(Number(v))+'%';
 function dateLabel(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(d);}
 function paintSummary(d){const r=d.resumo||{};document.getElementById('kCampaigns').textContent=r.campanhas??'—';document.getElementById('kDone').textContent=r.metaAtingida??'—';document.getElementById('kBelow').textContent=r.abaixoMeta??'—';document.getElementById('competence').textContent='Competência '+(d.competencia||'—');document.getElementById('updated').textContent='Atualizado: '+dateLabel(d.atualizadoEm);}
 function filtered(){let rows=[...state.rows];const q=document.getElementById('search').value.trim().toLocaleUpperCase('pt-BR');if(q)rows=rows.filter(r=>String(r.laboratorio||'').toLocaleUpperCase('pt-BR').includes(q));rows=rows.filter(r=>state.statuses.has(r.status));const sort=document.getElementById('sort').value;rows.sort((a,b)=>{if(sort==='PCT_DESC')return (b.atingimento??-1)-(a.atingimento??-1);if(sort==='SALE_DESC')return (b.venda??-1)-(a.venda??-1);if(sort==='GOAL_DESC')return (b.objetivo??-1)-(a.objetivo??-1);if(sort==='AZ')return String(a.laboratorio).localeCompare(String(b.laboratorio),'pt-BR');return (a.atingimento??1e9)-(b.atingimento??1e9);});return rows;}
 function card(r){const pct=r.atingimento;const width=pct==null?0:Math.min(Math.max(Number(pct),0),100);const achieved=r.status==='META_ATINGIDA';const klass=achieved?'achieved':'below';let delta=achieved?'<span class="delta good">Acima da meta: '+fmtMoney(r.excedente)+'</span>':'<span class="delta bad">Falta: '+fmtMoney(r.falta)+'</span>';const projClass=r.projecaoAtingeMeta?'good':'bad';return '<article class="lab-card '+klass+'"><div class="lab-head"><div class="lab-name">'+esc(r.laboratorio)+'</div><span class="badge '+(r.regraEspecial?'general':'')+'">'+(r.regraEspecial?'VENDA GERAL':'TELEVENDAS')+'</span></div><div class="metrics"><div class="metric"><span>Objetivo</span><b>'+fmtMoney(r.objetivo)+'</b></div><div class="metric"><span>Venda</span><b>'+fmtMoney(r.venda)+'</b></div><div class="metric"><span>Atingimento</span><b>'+fmtPct(r.atingimento)+'</b></div><div class="metric"><span>Venda/dia necessária</span><b>'+fmtMoney(r.vendaDiaNecessaria)+'</b></div><div class="metric projection"><span>Projeção</span><b class="'+projClass+'">'+fmtMoney(r.projecao)+'</b></div></div><div class="progress-row"><div class="progress"><div class="bar" style="width:'+width+'%"></div></div><div class="pct">'+fmtPct(pct)+'</div></div><div class="foot">'+delta+'<span>'+esc(r.escopoLabel||'')+' · '+Number(r.diasUteisRestantes||0)+' dias úteis restantes</span></div></article>';}
 function render(){const rows=filtered();document.getElementById('grid').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">Nenhuma campanha encontrada com os filtros atuais.</div>';}
 function setupStatusFilters(){document.querySelectorAll('.status-filter').forEach(btn=>btn.addEventListener('click',()=>{const status=btn.dataset.status;if(state.statuses.has(status)){if(state.statuses.size===1)return;state.statuses.delete(status);btn.classList.remove('active');}else{state.statuses.add(status);btn.classList.add('active');}render();}));}
 async function load(){const grid=document.getElementById('grid');const btn=document.getElementById('refreshBtn');btn.disabled=true;grid.innerHTML='<div class="loading">Atualizando campanhas…</div>';try{const res=await fetch('/minhas-campanhas/api/dados',{credentials:'include'});if(res.status===401){location.href='/';return;}const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.detail||'Não foi possível carregar as campanhas.');state.data=body;state.rows=Array.isArray(body.campanhas)?body.campanhas:[];paintSummary(body);const warnings=document.getElementById('warnings');const list=Array.isArray(body.avisos)?body.avisos:[];warnings.style.display=list.length?'block':'none';warnings.innerHTML=list.map(x=>'• '+esc(x)).join('<br>');render();}catch(err){grid.innerHTML='<div class="error"><b>Não foi possível carregar Minhas campanhas.</b><br>'+esc(err.message||err)+'</div>';}finally{btn.disabled=false;}}
 document.getElementById('search').addEventListener('input',render);document.getElementById('sort').addEventListener('change',render);document.getElementById('refreshBtn').addEventListener('click',load);setupStatusFilters();load();
})();
</script>
</body>
</html>
