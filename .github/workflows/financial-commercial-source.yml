name: Finance-only commercial source validation
on:
  push:
    branches:
      - feature/financial-commercial-source-only-20260925
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-financial-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated Apps Script helper syntax
        run: node --check < financeiro/v225_premiacao_sql_source.gs
      - name: Run financial-only source tests
        run: node tests/test_financial_commercial_source.cjs
      - name: Ensure commercial update and HOME files were not changed
        run: |
          git diff --exit-code 'HEAD~3' HEAD -- api/main.py api/prod597_app.py api/home_publication.py api/monthly_commercial_live.py api/monthly_commercial_overlay.py frontend/home-publication-prod59823.js frontend/monthly-sync-prod597.js
