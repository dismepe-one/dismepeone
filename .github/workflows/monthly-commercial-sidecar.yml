name: Monthly commercial sidecar validation
on:
  push:
    branches:
      - feature/monthly-commercial-sidecar-20260925
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production and test dependencies
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Compile changed Python files
        run: |
          python -m compileall -q api/main.py api/prod597_app.py api/cache_reads.py api/monthly_source_normalization.py api/monthly_commercial_live.py api/monthly_commercial_overlay.py
      - name: Test commercial-only SQL snapshot and access isolation
        run: |
          python -m pytest -q tests/test_monthly_commercial_sidecar.py tests/test_bootstrap_scope.py tests/test_api.py
