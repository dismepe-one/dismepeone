name: Monthly shadow validation (no publication)

on:
  push:
    branches:
      - feature/monthly-render-shadow-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate module syntax
        run: |
          python -m compileall -q api/monthly_awards_engine.py api/monthly_auxiliary_sources.py api/monthly_render_shadow.py api/monthly_render_parity.py api/monthly_manual_indicators.py api/monthly_special_awards.py api/monthly_special_preview.py api/monthly_source_normalization.py api/monthly_homologation_cli.py api/monthly_homologation_sql_probe.py api/monthly_homologation.py api/monthly_google_reader.py api/monthly_google_probe.py
      - name: Execute isolated shadow tests (no Drive credentials or DB writes)
        run: |
          python -m pytest -q tests/test_monthly_awards_engine.py tests/test_monthly_auxiliary_sources.py tests/test_monthly_source_audit.py tests/test_monthly_render_shadow.py tests/test_monthly_render_parity.py tests/test_monthly_manual_indicators.py tests/test_monthly_special_awards.py tests/test_monthly_special_preview.py tests/test_monthly_source_normalization.py
