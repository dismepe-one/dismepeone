services:
  web:
    image: python:3.12-slim
    working_dir: /app
    environment:
      - DISMEPE_CORS_ORIGINS=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - DISMEPE_COOKIE_SECURE=false
      - ENVIRONMENT=development
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    volumes:
      - ./:/app
    ports:
      - "3000:8000"
    depends_on: []
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends poppler-utils && rm -rf /var/lib/apt/lists/*
      && pip install --no-cache-dir -r requirements.txt
      && uvicorn api.prod597_app:app --host 0.0.0.0 --port 8000 --reload"
